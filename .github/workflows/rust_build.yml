name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rustup and Target
        run: |
          rustup set profile minimal
          rustup toolchain install nightly-2024-02-01
          rustup default nightly-2024-02-01
          rustup target add aarch64-skyline-switch --toolchain nightly-2024-02-01

      - name: Install cargo-skyline
        run: cargo install cargo-skyline --locked

      - name: Build release NRO
        run: cargo skyline build --release

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: target/aarch64-skyline-switch/release/*.nro
